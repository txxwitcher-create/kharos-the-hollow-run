
name: KHAROS Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web game
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: KHAROS-Web-Build
          path: dist/
